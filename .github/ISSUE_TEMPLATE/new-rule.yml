name: New rule
description: Request an HTML check that deadhead does not cover yet.
title: "[rule] "
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest one missing HTML check per issue. You do not need to know the rule ID,
        selector syntax, severity, or implementation. Include standards or browser
        documentation if you have it; the maintainer will research the rule before implementation.
  - type: textarea
    id: pattern
    attributes:
      label: What should deadhead check?
      description: Describe the HTML pattern that existing rules do not cover.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: HTML example
      description: Show a small example of the markup you want deadhead to check.
      render: html
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Why should deadhead report it?
      description: Explain the effect on users, browsers, accessibility, performance, or maintenance.
    validations:
      required: true
  - type: textarea
    id: replacement
    attributes:
      label: Suggested replacement
      description: Show a better alternative if you know one, or explain why the markup can be removed.
  - type: textarea
    id: resources
    attributes:
      label: Sources
      description: Optional links to specifications, browser documentation, or other evidence.
  - type: textarea
    id: related
    attributes:
      label: Related rules or issues
      description: Link any existing checks or discussions you found while looking for this rule.
