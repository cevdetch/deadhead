name: Release

# A pushed v* tag (signed, pushed by the maintainer from main) builds, tests
# and stages both packages. Nothing reaches npm until the maintainer approves
# each staged package with 2FA: `npm stage list`, then `npm stage approve`.
#
# Run by hand (workflow_dispatch) on main, it is a dry run of the same job:
# everything up to `npm stage publish --dry-run`, with no tag check, no upload
# and no GitHub Release. Run it before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release at a time, and never cancelled halfway through staging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The trusted publisher on npmjs.com names this workflow and environment.
    # The trusted publisher on npmjs.com is bound to `npm`; a dry run uses
    # another environment, so it could not upload even by mistake.
    environment: ${{ github.event_name == 'push' && 'npm' || 'release-dry-run' }}
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (OIDC); provenance follows from it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Tag matches both manifests
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in packages/cli packages/eslint-plugin; do
            test "v$(node -p "require('./$pkg/package.json').version")" = "$TAG"
          done

      - run: pnpm validate:rules
      - run: pnpm build
      - run: pnpm build:css
      - run: pnpm build:bookmarklet
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:packages
      # Packs into tarballs/, installs and uses them. The same files are staged
      # below, so what was tested is what ships.
      - run: node scripts/smoke-packages.ts --out tarballs

      # pnpm/setup installs Node without its npm, so `npm` on PATH is the
      # runner image's (10.9.9 on 2026-10-01), which has no `stage`, and
      # `npm install --global` lands in a prefix that is not first on PATH.
      # So the step runs a pinned npm through npx, by version, on this job's
      # Node: `stage` needs 11.15, trusted publishing (OIDC) 11.5.1. No token
      # and no registry-url: trusted publishing exchanges this job's OIDC token.
      # A version already on npm (0.1.0, published by hand before trusted
      # publishing could exist) is left alone; the release notes still follow.
      - name: Stage both packages
        env:
          DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
        run: |
          npm_pinned() { npx --yes npm@12.2.0 "$@"; }
          npm_pinned --version
          for pkg in packages/cli packages/eslint-plugin; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm_pinned view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; not staging it"
              continue
            fi
            # `./`: npm 12 reads a bare `tarballs/x.tgz` as GitHub shorthand.
            npm_pinned stage publish "./tarballs/$name-$version.tgz" --access public $DRY_RUN
          done

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The section headed "## X.Y.Z" or "## X.Y.Z - <date>", up to the next one.
          awk -v v="## ${TAG#v}" '$0==v || index($0, v " - ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
