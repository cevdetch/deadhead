name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so skip the credential helper entirely.
          persist-credentials: false

      # One step installs the pinned pnpm (read from "packageManager") as a
      # native binary — no npm self-install, no v11-then-switch-to-v12 — plus
      # the Node floor. This replaces pnpm/action-setup (npm-based: ~12s of
      # self-installer + version switch, and it left a stale v11 store path
      # behind) followed by setup-node (~5s, mostly a cache lookup that
      # missed anyway). `require-lockfile` installs with --frozen-lockfile,
      # which fails on a missing or out-of-date lockfile.
      # No store cache: a cold install is ~2.5s for 368 packages, cheaper
      # than restoring + uploading a ~94MB cache on every run.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          # Single version: 24 is the floor declared in engines. If it passes
          # on the floor it passes above; a second runner doubles minutes
          # for no signal on this codebase.
          runtime: node@24
          require-lockfile: true

      # Rules first: a malformed frontmatter field should fail in two seconds,
      # not after the whole suite has run.
      - run: pnpm validate:rules
      - run: pnpm build
      # The browser artifacts are generated from rules.json, so they break the
      # same way a rule does. Build them here rather than finding out at
      # release time.
      - run: pnpm build:css
      - run: pnpm build:bookmarklet
      - run: pnpm typecheck
      - run: pnpm test
      # Lint our own clean fixtures with our own CLI. It targets valid.html
      # only: the invalid.html files next to them are supposed to have
      # findings, so pointing this at the whole tree could only ever fail.
      - run: pnpm check:self

      # Folded into this job instead of a second runner: one checkout, one
      # install. A linter about shipping things you do not need should hold
      # itself to it. Pinned exact in devDependencies rather than `dlx`
      # @latest: `dlx` executes whatever was published minutes ago, and a
      # project that rejected a dependency over an RCE should not hand CI an
      # unpinned one. Running from the lockfile also skips the per-run `dlx`
      # download of the tool itself.
      #
      # Gated on errors, not warnings. Every current warning is a duplicate
      # transitive version inside a dev dependency's own tree — parse5,
      # linkedom, and now Astro under site/ — none of it shipped, none of it
      # ours to fix. They still print. Revisit when the packages are published
      # and the analysis has real output to judge.
      - run: pnpm lint:deps

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          runtime: node@24
          require-lockfile: true

      # The documentation site is built from the same content/rules markdown,
      # so a rule that breaks the linter breaks the site too. Building it here
      # also typechecks the .astro files, and check:site then runs the CLI over
      # the rendered output: the head this project ships is held to the rules
      # this project ships.
      - run: pnpm build
      - run: pnpm site:check
      - run: pnpm check:site
      # A draft post builds only with DEADHEAD_DRAFTS=1. When one exists, build
      # that way too, so a broken draft fails here and not on the day it ships.
      - name: check:site with draft posts
        run: |
          if grep -lqs '^draft: true' content/blog/*.md; then
            DEADHEAD_DRAFTS=1 pnpm check:site
          else
            echo "No draft posts in content/blog."
          fi

  packages:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          runtime: node@24
          require-lockfile: true

      # What would be published, checked as npm and a consumer see it: publint
      # and the pack list, then the tarballs installed into an empty ESM
      # project with ESLint 10 and TypeScript 7 and used for real.
      - run: pnpm check:packages
      - run: pnpm smoke:packages

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Static analysis of the workflows themselves (template injection,
      # over-broad permissions, unpinned actions). The zizmor version is pinned
      # like every other tool here; `latest` would run whatever shipped today.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
