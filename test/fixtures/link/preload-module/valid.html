<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modulepreload for a module</title>
    <link rel="modulepreload" href="/app.js">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <p>The modulepreload above feeds the module map, so the module runs from the preloaded copy.</p>
  </body>
</html>
