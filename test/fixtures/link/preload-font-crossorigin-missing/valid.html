<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A font downloaded once</title>
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/css/fonts.css" as="style">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="preload" href="/css/icons.css" as="font">
  </head>
  <body>
    <p>The preload matches the font request, and the style preload needs no crossorigin.</p>
  </body>
</html>
