<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unsupported hreflang codes</title>
    <link rel="alternate" hreflang="en_US" href="https://example.com/us/">
    <link rel="alternate" hreflang="en-UK" href="https://example.com/uk/">
    <link rel="alternate" hreflang="es-419" href="https://example.com/latam/">
    <link rel="alternate" hreflang="us" href="https://example.com/us/">
    <link rel="alternate" hreflang="fil" href="https://example.com/ph/">
  </head>
  <body>
    <p>Five links; none is fixed.</p>
  </body>
</html>
