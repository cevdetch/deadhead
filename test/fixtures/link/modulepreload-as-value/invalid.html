<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Module preloads that preload nothing</title>
    <link rel="modulepreload" href="/app.mjs" as="fetch">
    <link rel="modulepreload" href="/fonts/inter.woff2" as="font" crossorigin>
  </head>
  <body>
    <p>Both preloads above fire error, so the module below waits for its own fetch.</p>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
