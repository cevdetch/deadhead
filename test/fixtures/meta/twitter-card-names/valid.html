<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A great post</title>
    <meta property="og:type" content="article">
    <meta property="og:title" content="A great post">
    <meta property="og:description" content="Summary of the post.">
    <meta property="og:image" content="https://example.com/cover.jpg">
    <meta property="og:url" content="https://example.com/post">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <p>Open Graph describes the preview once, and twitter:card picks the large layout.</p>
  </body>
</html>
